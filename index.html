<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PT tmbA01 Mesh Test</title>
<style>html,body{margin:0;height:100%;background:#0b0e13;color:white;font-family:system-ui}canvas{width:100%;height:calc(100% - 55px);display:block}header{height:55px;padding:8px 14px;box-sizing:border-box;background:#171c25}</style></head>
<body><header><b>Priston Tale tmbA01 — Actual Mesh Test</b><br><small>Drag to rotate • wheel to zoom • original SMD triangle data</small></header><canvas id=c></canvas>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let D,ang=.2,tilt=.1,zoom=90,drag=false,lx=0,ly=0;
function rs(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}onresize=rs;rs();
c.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointermove=e=>{if(drag){ang+=(e.clientX-lx)*.01;tilt+=(e.clientY-ly)*.01;lx=e.clientX;ly=e.clientY}};c.onwheel=e=>{zoom*=e.deltaY>0?.9:1.1};
function P(v){let [a,b,d]=v;if(Math.abs(a)>1e5)return null;let ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(tilt),st=Math.sin(tilt);let X=a*ca-d*sa,Z=a*sa+d*ca,Y=b*ct-Z*st;Z=b*st+Z*ct;return[c.clientWidth/2+X*zoom,c.clientHeight*.58-Y*zoom,Z]}
function draw(){rs();x.save();x.scale(devicePixelRatio,devicePixelRatio);x.clearRect(0,0,c.clientWidth,c.clientHeight);x.strokeStyle='#d7dde8';x.lineWidth=.7;
if(D)for(const p of D.parts)for(const f of p.faces){let a=P(p.vertices[f[0]]),b=P(p.vertices[f[1]]),d=P(p.vertices[f[2]]);if(!a||!b||!d)continue;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(d[0],d[1]);x.closePath();x.stroke()}
x.restore();requestAnimationFrame(draw)}fetch('mesh.json').then(r=>r.json()).then(j=>D=j);draw();
</script></body></html>
